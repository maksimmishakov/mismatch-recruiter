from flask import Blueprint, request, jsonify
from app.models import db, Candidate, Job, Match

matching_bp = Blueprint('matching', __name__, url_prefix='/api/matching')

@matching_bp.route('/candidates-to-vacancy/<int:job_id>', methods=['GET'])
def candidates_for_job(job_id):
    job = Job.query.get_or_404(job_id)
    matches = Match.query.filter_by(job_id=job_id).order_by(Match.overall_score.desc()).all()
    return jsonify({'job_id': job_id, 'job_title': job.title, 'total_matches': len(matches), 'matches': [m.to_dict() for m in matches[:10]]}), 200

@matching_bp.route('/vacancy-to-candidate/<int:candidate_id>', methods=['GET'])
def jobs_for_candidate(candidate_id):
    candidate = Candidate.query.get_or_404(candidate_id)
    matches = Match.query.filter_by(candidate_id=candidate_id).order_by(Match.overall_score.desc()).all()
    return jsonify({'candidate_id': candidate_id, 'candidate_name': candidate.name, 'total_matches': len(matches), 'matches': [m.to_dict() for m in matches[:10]]}), 200

@matching_bp.route('/recalculate/<int:candidate_id>/<int:job_id>', methods=['POST'])
def recalculate_match(candidate_id, job_id):
    candidate = Candidate.query.get_or_404(candidate_id)
    job = Job.query.get_or_404(job_id)
    match = Match.query.filter_by(candidate_id=candidate_id, job_id=job_id).first() or Match(candidate_id=candidate_id, job_id=job_id)
    match.overall_score, match.skills_score = 0.75, 0.80
    db.session.add(match) if not match.id else None
    db.session.commit()
    return jsonify(match.to_dict()), 200
