version: '3.8'

services:
  postgres:
    image: postgres:13
    environment:
      POSTGRES_DB: mismatch_db
      POSTGRES_USER: mismatch
      POSTGRES_PASSWORD: mismatch123
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:6
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "5000:5000"
    environment:
      DATABASE_URL: postgresql://mismatch:mismatch123@postgres:5432/mismatch_db
      REDIS_URL: redis://redis:6379/0
    depends_on:
      - postgres
      - redis
    volumes:
      - ./backend:/app

volumes:
  postgres_data:
  redis_data:
