from flask import Blueprint, request, jsonify
from flask_jwt_extended import jwt_required, get_jwt_identity
from app.models import db, Candidate

candidates_bp = Blueprint('candidates', __name__, url_prefix='/api/candidates')

@candidates_bp.route('', methods=['GET'])
def get_candidates():
    page, per_page = request.args.get('page', 1, int), request.args.get('per_page', 20, int)
    pagination = Candidate.query.paginate(page=page, per_page=per_page)
    return jsonify({'total': pagination.total, 'pages': pagination.pages, 'candidates': [c.to_dict() for c in pagination.items]}), 200

@candidates_bp.route('/<int:id>', methods=['GET'])
def get_candidate(id):
    candidate = Candidate.query.get_or_404(id)
    return jsonify(candidate.to_dict()), 200

@candidates_bp.route('', methods=['POST'])
@jwt_required()
def create_candidate():
    user_id, data = get_jwt_identity(), request.get_json()
    candidate = Candidate(name=data.get('name'), email=data.get('email'), skills=data.get('skills', []), recruiter_id=user_id)
    db.session.add(candidate)
    db.session.commit()
    return jsonify(candidate.to_dict()), 201
