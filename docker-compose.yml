version: '3.9'

services:
  db:
    image: postgres:15-alpine
    container_name: mismatch_db
    environment:
      POSTGRES_USER: recruiter_user
      POSTGRES_PASSWORD: secure_password
      POSTGRES_DB: mismatch_recruiter
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U recruiter_user"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: mismatch_backend
    environment:
      DATABASE_URL: postgresql://recruiter_user:secure_password@db:5432/mismatch_recruiter
      FLASK_ENV: development
      JWT_SECRET_KEY: dev-secret-key-change-in-production
    ports:
      - "5000:5000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend:/app
    command: python main.py

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: mismatch_frontend
    ports:
      - "3000:3000"
    environment:
      REACT_APP_API_URL: http://localhost:5000/api
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
      - /app/node_modules

volumes:
  postgres_data:
