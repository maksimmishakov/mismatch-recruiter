version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: mismatch-postgres
    environment:
      POSTGRES_USER: app_user
      POSTGRES_PASSWORD: app_password
      POSTGRES_DB: mismatch_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app_user"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - mismatch_network

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: mismatch-backend
    ports:
      - "5000:5000"
    environment:
      DATABASE_URL: postgresql://app_user:app_password@postgres:5432/mismatch_db
      FLASK_ENV: development
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./backend:/app
    networks:
      - mismatch_network

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: mismatch-frontend
    ports:
      - "3000:3000"
    environment:
      REACT_APP_API_URL: http://backend:5000
    depends_on:
      - backend
    networks:
      - mismatch_network

volumes:
  postgres_data:

networks:
  mismatch_network:
    driver: bridge
