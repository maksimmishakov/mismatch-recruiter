version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: mismatch-postgres
    environment:
      POSTGRES_USER: mismatch
      POSTGRES_PASSWORD: dev-password
      POSTGRES_DB: mismatch_dev
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mismatch"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - mismatch-network

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: mismatch-backend
    environment:
      FLASK_ENV: development
      FLASK_DEBUG: "True"
      DATABASE_URL: postgresql://mismatch:dev-password@postgres:5432/mismatch_dev
      JWT_SECRET_KEY: dev-secret-key-change-me
    ports:
      - "5000:5000"
    volumes:
      - ./backend:/app
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - mismatch-network

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: mismatch-frontend
    environment:
      VITE_APP_API_URL: http://localhost:5000/api
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend
    networks:
      - mismatch-network

volumes:
  postgres_data:

networks:
  mismatch-network:
    driver: bridge
