# DISABLED: name: Backend Lint

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  backend-lint:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Python 3.12
      uses: actions/setup-python@v4
      with:
        python-version: '3.12'
    
    - name: Install linting tools
      run: |
        python -m pip install --upgrade pip
        pip install black isort flake8 pylint
    
    - name: Check code formatting (black)
      run: |
        cd backend
        black --check app/ routes/ models/ || true
    
    - name: Check import ordering (isort)
      run: |
        cd backend
        isort --check-only app/ routes/ models/ || true
    
    - name: Run flake8
      run: |
        cd backend
        flake8 app/ routes/ models/ || true
    
    - name: Run pylint
      run: |
        cd backend
        pylint app/ routes/ models/ || true
