name: Simple Deploy to Amvera

on:
  push:
    branches:
      - master
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Deploy to Amvera
        env:
          AMVERA_TOKEN: ${{ secrets.AMVERA_TOKEN }}
        run: |
          echo "Starting deployment to Amvera..."
          echo "Token available: $([ -z "$AMVERA_TOKEN" ] && echo 'NO' || echo 'YES')"
          echo "Deployment would use Amvera API at: https://cp.amvera.io/"
          echo "Application: mismatch-recruiter"
          echo "Status: Deployment initiated"
