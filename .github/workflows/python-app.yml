name: Python application

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    - name: Set up Python 3.10
      uses: actions/setup-python@v4
      with:
        python-version: "3.10"
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r backend/requirements.txt
    - name: Set environment variables
      run: |
        echo "FLASK_ENV=testing" >> $GITHUB_ENV
        echo "DATABASE_URL=sqlite:///test.db" >> $GITHUB_ENV
        echo "SECRET_KEY=test-secret-key-ci" >> $GITHUB_ENV
    - name: Create test database
      run: |
        cd backend
        python -c "import sys; sys.path.insert(0, '.'); from app import create_app, db; app = create_app('testing'); app.app_context().__enter__(); db.create_all(); print('Database initialized')"
    - name: Lint with flake8
      run: |
        pip install flake8
        flake8 backend/app --count --select=E9,F63,F7,F82 --show-source --statistics
        continue-on-error: true
    - name: Run tests with pytest
      run: |
        cd backend
        pip install pytest pytest-cov
        pytest -v --tb=short
