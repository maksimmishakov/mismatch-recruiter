name: Deploy to Amvera

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Deploy to Amvera
      env:
        AMVERA_TOKEN: ${{ secrets.AMVERA_TOKEN }}
      run: |
        curl -X POST https://api.amvera.io/v1/deployment/trigger \
          -H "Authorization: Bearer $AMVERA_TOKEN" \
          -H "Content-Type: application/json" \
          -d '{"branch":"main","environment":"production"}'
