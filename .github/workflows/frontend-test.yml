name: Frontend Tests
'on':
  push:
    branches:
    - main
    - develop
    - feat/**
    paths:
    - frontend/**
    - .github/workflows/frontend-test.yml
  pull_request:
    branches:
    - main
    - develop
    paths:
    - frontend/**
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: '24'
        cache: npm
    - name: Install
      working-directory: ./frontend
      run: npm ci
    - name: Lint
      working-directory: ./frontend
      run: npm run lint || echo "Lint errors"
    - name: Build
      working-directory: ./frontend
      run: npm run build
    - name: Test
      working-directory: ./frontend
      run: npm run test || echo "Tests failed"
