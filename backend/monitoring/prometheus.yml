global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    monitor: 'mismatch-recruiter'

scrape_configs:
  - job_name: 'flask-app'
    static_configs:
      - targets: ['localhost:5000']
    metrics_path: '/metrics'
  
  - job_name: 'redis'
    static_configs:
      - targets: ['localhost:6379']
  
  - job_name: 'postgres'
    static_configs:
      - targets: ['localhost:5432']
