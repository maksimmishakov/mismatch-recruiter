# Amvera Cloud configuration
appId: mismatch-recruiter
language: python3.12

# Build configuration
build:
  containerName: mismatch-backend
  dockerfilePath: backend/Dockerfile

# Environment variables
env:
  FLASK_ENV: production
  FLASK_DEBUG: "False"
  LOG_LEVEL: INFO

# Services
services:
  backend:
    replicas: 2
    resources:
      cpu: 1000m
      memory: 512Mi
    port: 5000
    healthcheck:
      path: /health
      interval: 30s
      timeout: 10s

  postgres:
    image: postgres:15-alpine
    resources:
      cpu: 500m
      memory: 256Mi
    env:
      POSTGRES_DB: mismatch
      POSTGRES_USER: mismatch

# Volumes
volumes:
  postgres_data:
    size: 5Gi

# Networking
networking:
  ssl: true
  domain: mismatch-recruiter.amvera.io

# Auto deployment
deployment:
  branch: main
  auto: true
