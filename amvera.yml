project: mismatch-recruiter

env:
  - name: DATABASE_URL
    value: postgresql://user:pass@db:5432/mismatch_db
  - name: REDIS_URL
    value: redis://redis:6379/0
  - name: FLASK_ENV
    value: production

services:
  - name: backend
    image: mismatch-recruiter:backend
    port: 5000
    healthcheck:
      path: /health
      timeout: 10
    autoscaling:
      minInstances: 1
      maxInstances: 3
