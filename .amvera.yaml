enviroment: production

services:
  api:
    image: python:3.12-slim
    command: sh -c "pip install -r requirements.txt && python -m gunicorn --bind 0.0.0.0:5000 --workers 4 --timeout 60 --access-logfile - --error-logfile - wsgi:app"
    ports:
      - 5000
    environment:
      FLASK_ENV: production
      FLASK_DEBUG: 0
      DATABASE_URL: sqlite:///mismatch.db
      SECRET_KEY: ${SECRET_KEY}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      CORS_ORIGINS: "*"
      LOG_LEVEL: INFO
    healthcheck:
      test: "curl -f http://localhost:5000/api/health || exit 1"
      interval: 30
      timeout: 10
      retries: 3
      start_period: 5

env_vars:
  FLASK_ENV: production
  FLASK_DEBUG: 0
  DATABASE_URL: sqlite:///mismatch.db
  SECRET_KEY: lamoda-production-secret-2026
  JWT_SECRET_KEY: lamoda-jwt-secret-2026
  CORS_ORIGINS: "*"
  LOG_LEVEL: INFO
