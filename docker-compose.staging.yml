version: '3.9'

services:
  # Backend API
  web:
    image: ghcr.io/maksimmishakov/mismatch-recruiter:staging-latest
    container_name: mismatch-web-staging
    restart: always
    environment:
      FLASK_ENV: staging
      DATABASE_URL: postgresql://${DB_USER}:${DB_PASSWORD}@db:5432/${DB_NAME}_staging
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      SENTRY_DSN: ${SENTRY_DSN_STAGING}
    ports:
      - "5000:5000"
    depends_on:
      - db
      - redis
    volumes:
      - ./backend/logs:/var/log/mismatch
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - mismatch-staging

  # Frontend
  frontend:
    image: node:20-alpine
    container_name: mismatch-frontend-staging
    restart: always
    working_dir: /app
    command: npm install && npm run build && npm install -g serve && serve -s dist -l 3000
    environment:
      VITE_API_URL: https://staging-api.mismatch-recruiter.ru
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
    depends_on:
      - web
    networks:
      - mismatch-staging

  # PostgreSQL Database
  db:
    image: postgres:15-alpine
    container_name: mismatch-db-staging
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
    ports:
      - "5432:5432"
    volumes:
      - postgres_data_staging:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}_staging"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - mismatch-staging

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: mismatch-redis-staging
    restart: always
    command: redis-server --appendonly yes --maxmemory 512mb --maxmemory-policy allkeys-lru
    ports:
      - "6379:6379"
    volumes:
      - redis_data_staging:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - mismatch-staging

  # Celery Worker
  celery:
    image: ghcr.io/maksimmishakov/mismatch-recruiter:staging-latest
    container_name: mismatch-celery-staging
    restart: always
    environment:
      FLASK_ENV: staging
      DATABASE_URL: postgresql://${DB_USER}:${DB_PASSWORD}@db:5432/${DB_NAME}_staging
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
    command: celery -A app.tasks worker -l info --concurrency=4
    depends_on:
      - db
      - redis
    volumes:
      - ./backend/logs:/var/log/mismatch
    networks:
      - mismatch-staging

  # Prometheus Monitoring
  prometheus:
    image: prom/prometheus:latest
    container_name: mismatch-prometheus-staging
    restart: always
    ports:
      - "9090:9090"
    volumes:
      - ./backend/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data_staging:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=30d'
    networks:
      - mismatch-staging

  # Grafana Dashboards
  grafana:
    image: grafana/grafana:latest
    container_name: mismatch-grafana-staging
    restart: always
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: 'false'
    ports:
      - "3001:3000"
    volumes:
      - grafana_data_staging:/var/lib/grafana
      - ./backend/monitoring/grafana/dashboards:/etc/grafana/provisioning/dashboards
      - ./backend/monitoring/grafana/datasources:/etc/grafana/provisioning/datasources
    depends_on:
      - prometheus
    networks:
      - mismatch-staging

volumes:
  postgres_data_staging:
  redis_data_staging:
  prometheus_data_staging:
  grafana_data_staging:

networks:
  mismatch-staging:
    driver: bridgecat > .env.staging.template << 'EOF'
# STAGING ENVIRONMENT CONFIGURATION
# Copy to .env.staging and fill in values

# Flask Configuration
FLASK_ENV=staging
FLASK_DEBUG=False

# Database
DB_USER=staging
DB_PASSWORD=staging_secure_password_changeme
DB_NAME=mismatch
DATABASE_URL=postgresql://staging:staging_secure_password_changeme@db:5432/mismatch_staging

# JWT
JWT_SECRET_KEY=your_staging_jwt_secret_key_min_32_chars_required

# Redis
REDIS_URL=redis://redis:6379/0

# Email Configuration
MAIL_SERVER=smtp.gmail.com
MAIL_PORT=587
MAIL_USERNAME=your_staging_email@gmail.com
MAIL_PASSWORD=your_app_specific_password
MAIL_DEFAULT_SENDER=noreply-staging@mismatch-recruiter.ru

# Sentry Error Tracking
SENTRY_DSN_STAGING=https://your_key@sentry.io/your_project_id

# Grafana
GRAFANA_PASSWORD=grafana_staging_password_changeme

# API Configuration
API_RATE_LIMIT=100/hour

# CORS
CORS_ORIGINS=https://staging.mismatch-recruiter.ru,https://app-staging.mismatch-recruiter.ru

# Slack Notifications
SLACK_WEBHOOK_URL=https://hooks.slack.com/services/YOUR/WEBHOOK/URL

# Docker Registry
REGISTRY_USERNAME=your_github_username
REGISTRY_TOKEN=your_github_token
EOF
mkdir -p nginx && touch nginx/mismatch-staging.conf
ls -la nginx/
touch DEPLOYMENT_CHECKLIST.md
