# Staging environment Nginx configuration with SSL

# Redirect HTTP to HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name staging-api.mismatch-recruiter.ru staging.mismatch-recruiter.ru;
    
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
    
    location / {
        return 301 https://$host$request_uri;
    }
}

# Backend API Server
server {
    listen 443 ssl http/2;
    listen [::]:443 ssl http/2;
    server_name staging-api.mismatch-recruiter.ru;
    
    # SSL Configuration
    ssl_certificate /etc/letsencrypt/live/staging-api.mismatch-recruiter.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/staging-api.mismatch-recruiter.ru/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    
    # Security Headers
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    
    # Logging
    access_log /var/log/nginx/staging-api-access.log combined;
    error_log /var/log/nginx/staging-api-error.log;
    
    # Gzip compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript;
    gzip_min_length 1000;
    
    # API endpoints
    location /api {
        proxy_pass http://localhost:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection upgrade;
        proxy_set_header Upgrade $http_upgrade;
        
        # Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        
        # Buffering
        proxy_buffering on;
        proxy_buffer_size 4k;
        proxy_buffers 8 4k;
    }
    
    # Health check
    location /api/health {
        proxy_pass http://localhost:5000;
        proxy_set_header Host $host;
        access_log off;
    }
}

# Frontend Application Server
server {
    listen 443 ssl http/2;
    listen [::]:443 ssl http/2;
    server_name staging.mismatch-recruiter.ru;
    
    # SSL Configuration
    ssl_certificate /etc/letsencrypt/live/staging.mismatch-recruiter.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/staging.mismatch-recruiter.ru/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    
    # Security Headers
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    
    # Logging
    access_log /var/log/nginx/staging-app-access.log combined;
    error_log /var/log/nginx/staging-app-error.log;
    
    # Gzip compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript;
    gzip_min_length 1000;
    
    # Root directory
    root /var/www/mismatch-staging;
    
    # Frontend React App
    location / {
        try_files $uri $uri/ /index.html;
    }
    
    # Static assets with long cache
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
    
    # API proxy
    location /api {
        proxy_pass https://staging-api.mismatch-recruiter.ru;
        proxy_set_header Host staging-api.mismatch-recruiter.ru;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
