meta:
  environment: python
  version: 3.11

build:
  requirementsPath: requirements.txt

run:
  scriptName: wsgi.py
  command: python -m gunicorn --bind=0.0.0.0:5000 --workers 4 --timeout 60 --access-logfile - --error-logfile - wsgi:app
  containerPort: 5000

volumes:
  - mount: /data
    size: 1Gb
